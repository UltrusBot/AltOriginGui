plugins {
	alias libs.plugins.fabric.loom
	alias libs.plugins.publishing
	id 'maven-publish'
}
base {
	archivesName = project.archives_base_name
}
version = project.mod_version
group = project.maven_group

repositories {
	maven {
		name = "Quilt"
		url = uri("https://maven.quiltmc.org/repository/release")
	}
	maven {
		name = "Quilt Snapshots"
		url = uri("https://maven.quiltmc.org/repository/snapshot")
	}
	maven { url = "https://api.modrinth.com/maven" }
	maven { url = "https://maven.terraformersmc.com/" }
	maven { url = "https://maven.jamieswhiteshirt.com/libs-release/" }
	maven { url = "https://maven.shedaniel.me/" }
	maven { url = "https://maven.terraformersmc.com/" }
	maven { url "https://masa.dy.fi/maven" }
	maven {
		name = 'Ladysnake Mods'
		url = 'https://maven.ladysnake.org/releases'
	}
	maven {
		name = 'Ladysnake Mods Snapshots'
		url = 'https://maven.ladysnake.org/snapshots'
	}
	mavenLocal()
}

dependencies {
	minecraft(libs.minecraft)
	mappings(libs.yarn)
	modImplementation(libs.fabric.loader)
	modImplementation(libs.fabric.api)
	modImplementation(libs.modmenu)
	modImplementation(libs.origins)

	implementation(libs.mixinextras)
	annotationProcessor(libs.mixinextras)
	include(libs.mixinextras)

}

publishMods {
	displayName = "Alternate Origin UI v$project.version+${libs.minecraft.get().getVersionConstraint().displayName}"
	file = remapJar.archiveFile
	changelog = file("$rootDir/CHANGELOG.md").text
	version = "v${project.version}+${libs.minecraft.get().getVersionConstraint().displayName}"
	type = BETA
	modLoaders.addAll("fabric", "quilt")
	curseforge {
		projectId = "873788"
		minecraftVersions.add("1.21.1")
		accessToken = providers.gradleProperty("CF_API_KEY")
		requires {
			slug = "origins"
		}
	}
	modrinth {
		projectId = "ldWHqZwQ"
		minecraftVersions.add("1.21.1")
		accessToken = providers.gradleProperty("MODRINTH_TOKEN")
		requires {
			slug = "origins"
		}
	}
	github {
		repository = "UltrusBot/AltOriginGui"
		commitish = "1.21.1"
		accessToken = providers.gradleProperty("GH_TOKEN")
		tagName = "v$project.version"
	}

	dryRun = false
}
processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}